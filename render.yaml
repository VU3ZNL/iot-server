services:
  - type: web
    name: radiobuoy-iot
    runtime: node
    region: singapore          # closest to Bengaluru
    plan: free                 # change to starter ($7/mo) so it never sleeps
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: IOT_KEY           # enter the secret in the Render dashboard, not here
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SOS_WEBHOOK_URL
        sync: false
